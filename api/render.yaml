services:
  - type: web
    name: mira-api
    runtime: docker
    region: singapore
    plan: standard
    
    # Build configuration
    dockerfilePath: ./Dockerfile
    
    # Port configuration
    port: 8080
    
    # Environment variables
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mira-postgres
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

# Database service (if using Render's managed Postgres)
databases:
  - name: mira-postgres
    databaseName: mira
    user: mira_user
    region: singapore
